---
# Ad hoc scenario definitions for the support server validation jobs.
products:
  qubesos-4.3-securedrop-x86_64:
    distri: qubesos
    flavor: securedrop
    arch: x86_64
    version: '4.3'
    settings:
      XRES: '1920'
      YRES: '1080'
machines:
  64bit:
    backend: qemu
    settings:
      HDDMODEL: scsi-hd
      HDDSIZEGB: '80'
      NICMODEL: e1000e
      PART_TABLE_TYPE: mbr
      QEMUCPU: host,+vmx,+invtsc
      QEMUCPUS: '2'
      QEMUMACHINE: q35,kernel-irqchip=split
      QEMURAM: '8192'
      QEMU_DISABLE_SNAPSHOTS: '1'
      VIRTIO_CONSOLE: '1'
job_templates:
  support_server:
    product: qubesos-4.3-securedrop-x86_64
    machine: 64bit
    settings:
      HDD_1: focal-server-cloudimg-amd64.qcow2
      HDD_1_URL: https://cloud-images.ubuntu.com/focal/current/focal-server-cloudimg-amd64.img
      QEMURAM: '2048'
      # cloud-init reads user-data and meta-data from this URL on first boot
      QEMU_SMBIOS: type=1,serial=ds=nocloud-net;s=https://raw.githubusercontent.com/freedomofpress/openqa-tests-qubesos/support-server-validation/tests/securedrop/support_server_focal/
      SERIALDEV: ttyS0
      WORKER_CLASS: hdd_download
      SECUREDROP_SUPPORT_SERVER: focal
      NICTYPE_USER_OPTIONS: hostfwd=tcp::180%WORKER_INSTANCE%-:8000
      PARALLEL_ONE_HOST_ONLY: '1'
  support_server_client:
    product: qubesos-4.3-securedrop-x86_64
    machine: 64bit
    settings:
      HDD_1: disk_unencrypted_minimal_4.3_64bit_stable.qcow2
      KERNEL_VERSION: stable
      WORKER_CLASS: hdd_download
      SECUREDROP_USE_SUPPORT_SERVER: '1'
      PARALLEL_WITH: support_server
      PARALLEL_ONE_HOST_ONLY: '1'
